syntax = "proto3";

package scheduler.coordinator;

option java_multiple_files = true;
option java_package = "com.scheduler.proto.coordinator";

import "scheduler/v1/common.proto";
import "scheduler/v1/job_message.proto";

message RegisterWorkerRequest {
  string hostname = 1;
  int32 capacity = 2;
  int32 memory_mb = 3;
  int32 cpu_cores = 4;
  repeated string capabilities = 5;
}

message RegisterWorkerResponse {
  string worker_id = 1;
}

message PullJobRequest {
  string worker_id = 1;
}

message PullJobResponse {
  scheduler.v1.Job job = 1; // empty if no job available
}

message StatusUpdateResponse {
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {
  bool should_drain = 1;
}

// WorkerService is the coordinator-side gRPC service that workers connect to.
// Workers call these RPCs to register, pull jobs, stream status updates
// (both job-level and task-level), and send heartbeats.
service WorkerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc PullJob(PullJobRequest) returns (PullJobResponse);
  rpc ReportStatus(stream scheduler.v1.StatusUpdate) returns (StatusUpdateResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}
