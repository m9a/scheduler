syntax = "proto3";

package scheduler.v1;

option java_multiple_files = true;
option java_package = "com.scheduler.proto.v1";

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_STARTING = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_COMPLETED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELLED = 6;
  JOB_STATE_KILLED = 7;
  reserved 8;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_COMPLETED = 3;
  TASK_STATE_FAILED = 4;
  reserved 5;
}

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_HEARTBEAT_LOST = 1;
  reserved 2;
  FAILURE_REASON_PROCESS_EXITED = 3;
  FAILURE_REASON_PROCESS_START_FAILED = 4;
  FAILURE_REASON_UNRESPONSIVE = 5;
  FAILURE_REASON_NOT_FOUND_ON_RECOVERY = 6;
}

enum ReportKind {
  REPORT_KIND_UNSPECIFIED = 0;
  REPORT_KIND_METRIC = 1;
  REPORT_KIND_ATTRIBUTE = 2;
  REPORT_KIND_COUNTER = 3;
  REPORT_KIND_EVENT = 4;
}

message Task {
  string id = 1;
  string name = 2;
  int32 sequence_number = 3;
  TaskState state = 4;
  repeated ReportEntry reports = 5;
}

message ReportEntry {
  string key = 1;
  ReportKind kind = 2;
  oneof value {
    string str_value = 3;
    double num_value = 4;
  }
}

// Coordinator -> Client, Worker
message Job {
  string id = 1;
  string name = 2;
  string artifact_uri = 3;
  reserved 4;
  JobState state = 5;
  repeated Task tasks = 6;
  int32 priority = 7;
  int64 created_at_millis = 8;
  int64 started_at_millis = 9;
  int64 completed_at_millis = 10;
  string error_message = 11;
  map<string, string> params = 12;
  repeated InputFile input_files = 13;
  FailureReason failure_reason = 14;
  string failure_detail = 15;
  ResourceRequirements resources = 16;
  int64 last_activity_at_millis = 17;
}

message InputFile {
  string name = 1;
  oneof source {
    string uri = 2;
    bytes content = 3;
  }
}

message ResourceRequirements {
  int32 memory_mb = 1;
  int32 cpu_cores = 2;
  bool gpu = 3;
  repeated string capabilities = 4;
}
