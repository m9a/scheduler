syntax = "proto3";

// Boundary: Coordinator <-> Worker (the worker's CoordinatorClient calls in).
package scheduler.worker.v1;

option java_multiple_files = true;
option java_package = "com.scheduler.proto.worker";

import "scheduler/v1/common.proto";
import "scheduler/v1/job_callback.proto";

message RegisterWorkerRequest {
  string hostname = 1;
  // What this worker offers — same shape as what jobs require.
  scheduler.v1.ResourceRequirements resources = 2;
}

message RegisterWorkerResponse {
  string worker_id = 1;
}

message PullJobRequest {
  string worker_id = 1;
}

message PullJobResponse {
  scheduler.v1.Job job = 1; // empty if no job available
}

message StatusUpdateResponse {
}

message ReportTelemetryResponse {
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {
  bool should_drain = 1;
}

// WorkerService is the coordinator-side gRPC service that workers connect to.
// Workers call these RPCs to register, pull jobs, stream status updates
// (both job-level and task-level), and send heartbeats.
service WorkerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc PullJob(PullJobRequest) returns (PullJobResponse);
  rpc ReportStatus(stream scheduler.job.v1.StatusUpdate) returns (StatusUpdateResponse);
  // Telemetry pipe — separate from the status stream so frequent, lossy reports
  // never crowd the rare, important lifecycle updates. Unary: the SDK throttles
  // to <=1 report/s per job, so per-call overhead is negligible.
  rpc ReportTelemetry(scheduler.job.v1.Report) returns (ReportTelemetryResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}
