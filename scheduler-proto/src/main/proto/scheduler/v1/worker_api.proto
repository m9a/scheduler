syntax = "proto3";

package scheduler.worker.v1;

option java_multiple_files = true;
option java_package = "com.scheduler.proto.worker";

import "scheduler/v1/common.proto";
import "scheduler/v1/job_callback.proto";

// Worker -> Coordinator
message RegisterWorkerRequest {
  string hostname = 1;
  scheduler.v1.ResourceRequirements resources = 2;
  string worker_id = 3;
  repeated scheduler.job.v1.StatusUpdate known_jobs = 4;
}

// Coordinator -> Worker
message RegisterWorkerResponse {
  string worker_id = 1;
  repeated string acked_job_ids = 2;
}

// Worker -> Coordinator
message PullJobRequest {
  string worker_id = 1;
}

// Coordinator -> Worker
message PullJobResponse {
  scheduler.v1.Job job = 1;
}

// Coordinator -> Worker
message StatusUpdateResponse {
}

// Coordinator -> Worker
message ReportTelemetryResponse {
}

// Worker -> Coordinator
message HeartbeatRequest {
  string worker_id = 1;
}

// Coordinator -> Worker
message HeartbeatResponse {
}

// Worker -> Coordinator
message SubscribeRequest {
  string worker_id = 1;
}

// Coordinator -> Worker
message SystemCommand {
  reserved 1;
  oneof kind {
    Drain drain = 2;
  }
}

// Coordinator -> Worker
message JobCommand {
  oneof kind {
    Cancel cancel = 1;
    Preempt preempt = 2;
  }
}

message Drain {
  bool drain = 1;
}

message Cancel {
  string job_id = 1;
  scheduler.v1.FailureReason reason = 2;
}

message Preempt {
  string job_id = 1;
}

service WorkerService {
  // Worker -> Coordinator
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  // Worker -> Coordinator
  rpc PullJob(PullJobRequest) returns (PullJobResponse);
  // Worker -> Coordinator
  rpc ReportStatus(stream scheduler.job.v1.StatusUpdate) returns (StatusUpdateResponse);
  // Worker -> Coordinator
  rpc ReportTelemetry(stream scheduler.job.v1.Report) returns (ReportTelemetryResponse);
  // Worker -> Coordinator
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Coordinator -> Worker
  rpc SystemCommands(SubscribeRequest) returns (stream SystemCommand);
  // Coordinator -> Worker
  rpc JobCommands(SubscribeRequest) returns (stream JobCommand);
}
