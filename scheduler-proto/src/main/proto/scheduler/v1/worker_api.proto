syntax = "proto3";

package scheduler.worker.v1;

option java_multiple_files = true;
option java_package = "com.scheduler.proto.worker";

import "scheduler/v1/common.proto";
import "scheduler/v1/job_callback.proto";

// Worker -> Coordinator
message RegisterWorkerRequest {
  string hostname = 1;
  scheduler.v1.ResourceRequirements resources = 2;
}

// Coordinator -> Worker
message RegisterWorkerResponse {
  string worker_id = 1;
}

// Worker -> Coordinator
message PullJobRequest {
  string worker_id = 1;
}

// Coordinator -> Worker
message PullJobResponse {
  scheduler.v1.Job job = 1;
}

// Coordinator -> Worker
message StatusUpdateResponse {
}

// Coordinator -> Worker
message ReportTelemetryResponse {
}

// Worker -> Coordinator
message HeartbeatRequest {
  string worker_id = 1;
}

// Coordinator -> Worker
message HeartbeatResponse {
  bool should_drain = 1;
}

service WorkerService {
  // Worker -> Coordinator
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  // Worker -> Coordinator
  rpc PullJob(PullJobRequest) returns (PullJobResponse);
  // Worker -> Coordinator
  rpc ReportStatus(stream scheduler.job.v1.StatusUpdate) returns (StatusUpdateResponse);
  // Worker -> Coordinator
  rpc ReportTelemetry(stream scheduler.job.v1.Report) returns (ReportTelemetryResponse);
  // Worker -> Coordinator
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}
