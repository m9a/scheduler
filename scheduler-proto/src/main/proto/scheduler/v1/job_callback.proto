syntax = "proto3";

package scheduler.job.v1;

option java_multiple_files = true;
option java_package = "com.scheduler.proto.job";

import "scheduler/v1/common.proto";

// SDK -> Worker -> Coordinator
message StatusUpdate {
  string job_id = 1;
  int32 task_index = 2;
  string task_name = 3;
  scheduler.v1.TaskState task_state = 4;
  string error_message = 5;
  int64 duration_ms = 6;
  string output = 7;
  scheduler.v1.JobState job_state = 8;
  scheduler.v1.FailureReason failure_reason = 9;
  string failure_detail = 10;
}

// SDK -> Worker -> Coordinator
message Report {
  string job_id = 1;
  int32 task_index = 2;
  int64 timestamp_ms = 3;
  repeated scheduler.v1.ReportEntry entries = 4;
}

// SDK -> Worker
message Liveness {
  string job_id = 1;
  int64 timestamp_ms = 2;
}
